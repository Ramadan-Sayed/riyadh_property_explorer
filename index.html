<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Riyadh Property Explorer</title>
  </head>
  <body>
    <header>
      <h1>Riyadh Property Explorer</h1>
      <p>Web GIS Property Viewer & Spatial Analysis</p>
    </header>

    <main>
      <aside>
        <h2>property Search</h2>
        <form>
          <label for="district">District</label>
          <input
            type="text"
            id="district"
            name="district"
            placeholder="e.g.Al-Malqa"
          />
          <button type="submit">Search Area</button>
        </form>
      </aside>

      <section id="map-container">
        <div
          id="map"
          style="
            height: 400px;
            background-color: #e5e5e5;
            text-align: center;
            line-height: 400px;
          "
        >
          Interactive Map Container (Leaflet / Mapbox Placeholder)
        </div>
      </section>
    </main>

    <footer>
      <small
        >&copy: 2026 Riyadh Property Explorer. Powered by web GIS
        Technology.</small
      >
    </footer>
  </body>
</html>
